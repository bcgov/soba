# Render with scripts/generate-gateway-config.mjs before applying with gwa.
# String placeholders are emitted as quoted YAML scalars by the generator.
kind: GatewayService
name: ${GATEWAY_SERVICE_NAME}
tags: [${CONFIG_TAG}]
host: ${BACKEND_HOST}
port: 4000
protocol: http
path: /chefs/api/v1
routes:
  - name: ${GATEWAY_SERVICE_NAME}
    tags: [${CONFIG_TAG}]
    hosts:
      - ${GATEWAY_HOSTNAME}
    protocols: [https]
    paths: [/]
    preserve_host: false
    strip_path: false
    path_handling: v0
