mongodb:
  enabled: true
  fullnameOverride: soba-dev-mongodb

  replicaCount: 1

  auth:
    existingSecret: soba-dev-mongodb-auth
    usernames:
      - formio
    databases:
      - formio-ce

  persistence:
    storageClass: netapp-block-standard
    size: 1Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 768Mi

  # TCP checks in place of the chart's exec probes, which start mongosh inside the container.
  customStartupProbe:
    tcpSocket:
      port: mongodb
    periodSeconds: 10
    failureThreshold: 30
  customLivenessProbe:
    tcpSocket:
      port: mongodb
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  customReadinessProbe:
    tcpSocket:
      port: mongodb
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  pdb:
    create: false

  podAntiAffinityPreset: soft

  networkPolicy:
    ingressPodMatchLabels:
      app.kubernetes.io/name: soba
      app.kubernetes.io/instance: soba-dev
      app.kubernetes.io/component: formio
    extraEgress:
      - ports:
          - port: 5353
            protocol: UDP
          - port: 5353
            protocol: TCP
