mongodb:
  enabled: true
  fullnameOverride: soba-dev-mongodb

  replicaCount: 1

  auth:
    existingSecret: soba-dev-mongodb-auth
    usernames:
      - formio
    databases:
      - formio-ce

  persistence:
    storageClass: netapp-block-standard
    size: 1Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

  pdb:
    create: true
    minAvailable: 1

  podAntiAffinityPreset: soft

  networkPolicy:
    ingressPodMatchLabels:
      app.kubernetes.io/name: soba
      app.kubernetes.io/instance: soba-dev
      app.kubernetes.io/component: formio
    extraEgress:
      - ports:
          - port: 5353
            protocol: UDP
          - port: 5353
            protocol: TCP
