# Crunchy Postgres values for SOBA Test.
# Consumed by bcgov/actions-openshift/crunchy; must be compatible with its bundled chart.
global:
  config:
    dbName: app

crunchy:
  enabled: true
  postgresVersion: 18
  imagePullPolicy: IfNotPresent
  image: "artifacts.developer.gov.bc.ca/bcgov-docker-local/crunchy-postgres-gis:ubi9-18.1-3.6-2547"
  clone:
    enabled: false
  restore:
    enabled: false
  instances:
    name: db
    replicas: 1
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9187'
    dataVolumeClaimSpec:
      # Test data and WAL volume sizes.
      storage: 5Gi
      storageClassName: netapp-block-standard
      walStorage: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
    replicaCertCopy:
      requests:
        cpu: 1m
        memory: 32Mi
  # Backups are disabled in this Test configuration.
  pgBackRest:
    enabled: false
    s3:
      enabled: false
  patroni:
    postgresql:
      pg_hba:
        - "host all all 0.0.0.0/0 scram-sha-256"
        - "host all all ::1/128 scram-sha-256"
      parameters:
        shared_buffers: 16MB
        wal_buffers: "-1"
        min_wal_size: 32MB
        max_wal_size: 64MB
        max_slot_wal_keep_size: 128MB
        work_mem: 2MB
        log_min_duration_statement: 1000ms
        effective_io_concurrency: 20
  proxy:
    enabled: true
    pgBouncer:
      replicas: 1
      requests:
        cpu: 5m
        memory: 32Mi
      maxConnections: 10
      poolMode: transaction
  pgmonitor:
    enabled: true
    exporter:
      requests:
        cpu: 10m
        memory: 32Mi
  users:
    - name: '{{ .Values.global.config.dbName }}'
      databases:
        - '{{ .Values.global.config.dbName }}'
      options: "SUPERUSER CREATEDB CREATEROLE"
    - name: 'postgres'
      databases:
        - 'postgres'
        - '{{ .Values.global.config.dbName }}'
    - name: '{{ .Values.global.config.dbName }}proxy'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
    - name: '{{ .Values.global.config.dbName }}proxytest'
      databases:
        - '{{ .Values.global.config.dbName }}'
        - 'postgres'
    - name: 'temporal'
      databases:
        - 'temporal'
        - 'temporal_visibility'
      options: "SUPERUSER CREATEDB CREATEROLE"
