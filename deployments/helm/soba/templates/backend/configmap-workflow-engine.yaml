apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soba.fullname" . }}-backend-workflow-engine
  labels:
    {{- include "soba.labels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  WORKFLOW_ENGINE_DEFAULT_CODE: {{ .Values.backend.config.workflowEngineDefaultCode | quote }}
  {{- with .Values.backend.workflowEngine.csWorkflowV1.apiBaseUrl }}
  PLUGIN_CS_WORKFLOW_V1_API_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.workflowEngine.csWorkflowV1.timeoutMs }}
  PLUGIN_CS_WORKFLOW_V1_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
