apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soba.fullname" . }}-backend-notification
  labels:
    {{- include "soba.labels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  NOTIFICATION_DEFAULT_CODE: {{ .Values.backend.config.notificationDefaultCode | quote }}
  {{- with .Values.backend.notification.notifyV1.endpoint }}
  PLUGIN_NOTIFY_V1_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.notification.notifyV1.timeoutMs }}
  PLUGIN_NOTIFY_V1_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
