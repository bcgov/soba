apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soba.fullname" . }}-backend-credential-issuer
  labels:
    {{- include "soba.labels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  CREDENTIAL_ISSUER_DEFAULT_CODE: {{ .Values.backend.config.credentialIssuerDefaultCode | quote }}
  {{- with .Values.backend.credentialIssuer.apsCredentialIssuerV3.apiBaseUrl }}
  PLUGIN_APS_CREDENTIAL_ISSUER_V3_API_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.credentialIssuer.apsCredentialIssuerV3.gatewayId }}
  PLUGIN_APS_CREDENTIAL_ISSUER_V3_GATEWAY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.credentialIssuer.apsCredentialIssuerV3.environmentAppId }}
  PLUGIN_APS_CREDENTIAL_ISSUER_V3_ENVIRONMENT_APP_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.credentialIssuer.apsCredentialIssuerV3.tokenUrl }}
  PLUGIN_APS_CREDENTIAL_ISSUER_V3_TOKEN_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.credentialIssuer.apsCredentialIssuerV3.timeoutMs }}
  PLUGIN_APS_CREDENTIAL_ISSUER_V3_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
