{{- if include "soba.storageUsesLocal" . }}
# File store of the default profile, mounted at backend.storage.defaultBasePath. ReadWriteMany,
# shared by every replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "soba.fullname" . }}-backend-filestore
  labels:
    {{- include "soba.labels" (dict "root" . "component" "backend") | nindent 4 }}
  annotations:
    {{- include "soba.keepPolicy" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.backend.storage.localVolume.accessMode }}
  {{- if .Values.backend.storage.localVolume.storageClassName }}
  storageClassName: {{ .Values.backend.storage.localVolume.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.storage.localVolume.size }}
{{- end }}
