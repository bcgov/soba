apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soba.fullname" . }}-backend-user-directory
  labels:
    {{- include "soba.labels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  USER_DIRECTORY_DEFAULT_CODE: {{ .Values.backend.config.userDirectoryDefaultCode | quote }}
  {{- with .Values.backend.userDirectory.cssV1.apiBaseUrl }}
  PLUGIN_CSS_V1_API_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.userDirectory.cssV1.environment }}
  PLUGIN_CSS_V1_ENVIRONMENT: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.userDirectory.cssV1.tokenUrl }}
  PLUGIN_CSS_V1_TOKEN_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.userDirectory.cssV1.timeoutMs }}
  PLUGIN_CSS_V1_TIMEOUT_MS: {{ . | quote }}
  {{- end }}
