{{- include "soba.validateStorage" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "soba.fullname" . }}-backend-storage
  labels:
    {{- include "soba.labels" (dict "root" . "component" "backend") | nindent 4 }}
data:
  # The s3 profile's endpoint, bucket and credentials come from Vault, not this ConfigMap.
  STORAGE_PROFILES: {{ .Values.backend.storage.profiles | quote }}
  FILES_STORAGE_PROFILE: {{ .Values.backend.storage.filesStorageProfile | quote }}
  FILES_MAX_FILE_SIZE_MB: {{ .Values.backend.storage.filesMaxFileSizeMb | quote }}
  TEMPLATES_STORAGE_PROFILE: {{ .Values.backend.storage.templatesStorageProfile | quote }}
  TEMPLATES_MAX_FILE_SIZE_MB: {{ .Values.backend.storage.templatesMaxFileSizeMb | quote }}
  JOB_RESULTS_STORAGE_PROFILE: {{ .Values.backend.storage.jobResultsStorageProfile | quote }}
  {{- with .Values.backend.storage.filesStoragePrefix }}
  FILES_STORAGE_PREFIX: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.storage.templatesStoragePrefix }}
  TEMPLATES_STORAGE_PREFIX: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.storage.jobResultsStoragePrefix }}
  JOB_RESULTS_STORAGE_PREFIX: {{ . | quote }}
  {{- end }}
  {{- if include "soba.storageUsesDefault" . }}
  STORAGE_PROFILE_DEFAULT_BACKEND: {{ .Values.backend.storage.defaultBackend | quote }}
  {{- end }}
  {{- if include "soba.storageUsesLocal" . }}
  STORAGE_PROFILE_DEFAULT_BASE_PATH: {{ required "backend.storage.defaultBasePath is required for storage-local" .Values.backend.storage.defaultBasePath | quote }}
  {{- end }}
  {{- if include "soba.storageUsesS3" . }}
  {{- with .Values.backend.storage.s3 }}
  STORAGE_PROFILE_S3_BACKEND: "storage-s3"
  {{- if .prefix }}
  STORAGE_PROFILE_S3_PREFIX: {{ .prefix | quote }}
  {{- end }}
  {{- if .port }}
  STORAGE_PROFILE_S3_PORT: {{ .port | toString | quote }}
  {{- end }}
  {{- if or (kindIs "bool" .useSsl) .useSsl }}
  STORAGE_PROFILE_S3_USE_SSL: {{ .useSsl | toString | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
