{{- $root := . }}
{{- if .Values.frontend.ingress.enabled }}
{{- range $name, $app := .Values.frontend.apps }}
{{- if ne $app.enabled false }}
{{- $host := include "soba.frontendHost" $root }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "soba.fullname" $root }}-frontend-{{ $name }}
  labels:
    {{- include "soba.labels" (dict "root" $root "component" (printf "frontend-%s" $name)) | nindent 4 }}
  {{- with $root.Values.frontend.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $root.Values.frontend.ingress.ingressClassName }}
  ingressClassName: {{ $root.Values.frontend.ingress.ingressClassName }}
  {{- end }}
  {{- if $root.Values.frontend.ingress.tls }}
  tls:
    - hosts:
        - {{ $host }}
      {{- if $root.Values.frontend.ingress.tlsSecretName }}
      secretName: {{ $root.Values.frontend.ingress.tlsSecretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: {{ $app.routePath | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "soba.fullname" $root }}-frontend-{{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
