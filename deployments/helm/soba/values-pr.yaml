# PR environment - minimal resources, single replica, the dev release's Form.io and MongoDB
backend:
  # Development data generator: on for PR review environments. Notifications send through notify-v1.
  # API keys issue through the APS issuer below.
  features:
    api-keys: "enabled"
    confirmation-email-copy: "enabled"
    confirmation-id-visibility: "enabled"
    confirmation-screen: "enabled"
    dev-data: "enabled"
    notifications: "enabled"
    post-submission: "enabled"
    post-submission-email: "enabled"
    post-submission-email-package: "enabled"
    submission-export: "enabled"
    user-search: "enabled"
  replicas: 1
  # The PR file store PVC is 1 Gi, shared with attachments and templates.
  jobs:
    resultMaxBytes: "52428800"
    resultRetentionDays: "1"
  # Files, templates and job results on a per-PR PVC, which pr_close deletes with the release. PRs
  # write nothing to S3.
  storage:
    profiles: default
    filesStorageProfile: default
    templatesStorageProfile: default
    jobResultsStorageProfile: default
  config:
    documentGenerationDefaultCode: cdogs-v2
    tenantEngineDefaultCode: cstar-v1
    credentialIssuerDefaultCode: aps-credential-issuer-v3
    workflowEngineDefaultCode: cs-workflow-v1
    notificationDefaultCode: notify-v1
    userSearchPlugins: css-v1,user-search-soba
    # Emails go through Notify test, which only delivers to its safelist.
    postSubmissionActionPlugins: post-submission-email-addresses,post-submission-email-package
    # Packages go with the PR's other job results, kept one day.
    postSubmissionEmailPackageRetentionDays: "1"
    # Ephemeral PR namespaces stage temp bytes under os.tmpdir() — no RWX PVC.
    tempStorageDefaultCode: tempstorage-os
    # Virus scan inherits virusscan-clamav from values.yaml: PRs deploy into the dev
    # namespace, so the <release>-clamav alias resolves to the shared dev clamav
    # (same namespace — no externalName override, no cross-namespace NSP needed).
    # Same for the cache, message bus and event stream (cache-redis, messagebus-redis and
    # eventstream-redis from values.yaml): PRs share the dev-namespace Valkey via the
    # <release>-valkey alias; the per-PR valkey.prefix keeps each PR's cached rows, bus events and
    # streams separate.
  credentialIssuer:
    apsCredentialIssuerV3:
      apiBaseUrl: https://api.gov.bc.ca/ds/api/v3
      # The PR gateway. The issuer account and product environment in the PR Vault secret must belong to it.
      gatewayId: "gw-d3969"
      tokenUrl: https://authz.apps.gov.bc.ca/auth/realms/aps/protocol/openid-connect/token
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs-dev.api.gov.bc.ca/api
      tokenUrl: https://dev.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
  tenantEngine:
    cstarV1:
      apiBaseUrl: https://test.connect.digital.gov.bc.ca/api/v1
  workflowEngine:
    csWorkflowV1:
      apiBaseUrl: https://test-workflow.apps.gold.devops.gov.bc.ca/api/v1
  notification:
    # A review environment sends a few emails a day.
    dailyLimit: "100"
    notifyV1:
      endpoint: https://gw-fe8c5-notify.test.api.gov.bc.ca/api/v1
      # Keeps one slow send well inside an email job's lease and timeout.
      timeoutMs: "10000"
  userSearch:
    cssV1:
      apiBaseUrl: https://api.loginproxy.gov.bc.ca/api/v1
      # Matches the SSO dev realm sign-in uses; BCeID accounts differ between CSS environments.
      environment: dev
      tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token
  sso:
    jwksUri: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs
    jwtIssuer: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    jwtAudience: connected-services-submit-6349
  migration:
    activeDeadlineSeconds: 600
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false

gatewayNetworkPolicy:
  namespaceName: "b8840c"
  environment: prod

frontend:
  # PR apps share the dev host (by path), so the dev gateway host serves them too.
  externalHosts:
    - submit-dev.api.gov.bc.ca
  replicas: 1
  readinessProbe:
    initialDelaySeconds: 25
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false

formio:
  internal:
    enabled: false
  external:
    url: http://soba-dev-formio.b82f30-dev:3001

mongodb:
  # Must stay false: the in-chart MongoDB is gated on this alone, not on formio.internal.enabled.
  internal:
    enabled: false

temporal:
  allowed: "true"
  address: ""
  namespace: "default"
  taskQueue: "soba"

temporalWorkers:
  - name: temporal-worker
    enabled: true
    taskQueue: "soba"
    replicas: 1
    healthPort: 9090
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 512Mi

vault:
  enabled: true
