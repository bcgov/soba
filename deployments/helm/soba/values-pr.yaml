# PR environment — minimal resources, single replica, internal Form.io + MongoDB
backend:
  # Development data generator: on for PR review environments. Notifications send through notify-v1.
  features:
    dev-data: "enabled"
    notifications: "enabled"
    post-submission: "enabled"
    user-search: "enabled"
  replicas: 1
  # Files and templates on a per-PR PVC, which pr_close deletes with the release. PRs write nothing to S3.
  storage:
    defaultBackend: storage-local
    defaultBasePath: /app/files
    localVolume:
      storageClassName: netapp-file-standard
  config:
    documentGenerationDefaultCode: cdogs-v2
    tenantEngineDefaultCode: cstar-v1
    workflowEngineDefaultCode: cs-workflow-v1
    notificationDefaultCode: notify-v1
    userSearchPlugins: css-v1,user-search-soba
    # Ephemeral PR namespaces stage temp bytes under os.tmpdir() — no RWX PVC.
    tempStorageDefaultCode: tempstorage-os
    # Virus scan inherits virusscan-clamav from values.yaml: PRs deploy into the dev
    # namespace, so the <release>-clamav alias resolves to the shared dev clamav
    # (same namespace — no externalName override, no cross-namespace NSP needed).
    # Same for the cache, message bus and event stream: PRs share the dev-namespace Valkey via the
    # <release>-valkey alias; the per-release key/channel/stream prefixes keep each PR's cached rows,
    # bus events and streams separate.
    cacheDefaultCode: cache-redis
    messagebusDefaultCode: messagebus-redis
    eventStreamDefaultCode: eventstream-redis
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs-dev.api.gov.bc.ca/api
      tokenUrl: https://dev.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
    cdogsV3:
      endpoint: http://common-document-generation-service-master.a12c97-prod:3000
  tenantEngine:
    cstarV1:
      apiBaseUrl: https://test.connect.digital.gov.bc.ca/api/v1
  workflowEngine:
    csWorkflowV1:
      apiBaseUrl: https://test-workflow.apps.gold.devops.gov.bc.ca/api/v1
  notification:
    notifyV1:
      endpoint: https://gw-fe8c5-notify.test.api.gov.bc.ca/api/v1
  userSearch:
    cssV1:
      apiBaseUrl: https://api.loginproxy.gov.bc.ca/api/v1
      environment: test
      tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token
  sso:
    jwksUri: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs
    jwtIssuer: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    jwtAudience: connected-services-submit-6349
  migration:
    activeDeadlineSeconds: 600
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: false

gatewayNetworkPolicy:
  namespaceName: "b8840c"
  environment: prod

frontend:
  replicas: 1
  readinessProbe:
    initialDelaySeconds: 25
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false

formio:
  internal:
    enabled: true
  replicas: 1
  # Formio depends on MongoDB; allow time for MongoDB to be ready after PR deploy
  readinessProbe:
    initialDelaySeconds: 45
    timeoutSeconds: 10
  livenessProbe:
    initialDelaySeconds: 60
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

mongodb:
  # MongoDB runs as its own release from deployments/helm/action-mongodb. The deploy
  # workflow supplies external.host and external.authSecretName.
  internal:
    enabled: false

temporal:
  allowed: "true"
  address: ""
  namespace: "default"
  taskQueue: "soba"

temporalWorkers:
  - name: temporal-worker
    enabled: true
    taskQueue: "soba"
    replicas: 1
    healthPort: 9090
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 512Mi

vault:
  enabled: true
