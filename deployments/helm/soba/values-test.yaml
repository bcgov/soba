# Test / UAT environment — two replicas, moderate resources
backend:
  # Development data generator: on in test, for integration runs. Notifications send through notify-v1.
  features:
    dev-data: "enabled"
    notifications: "enabled"
    post-submission: "enabled"
    post-submission-email: "enabled"
    user-search: "enabled"
  replicas: 2
  sso:
    jwksUri: https://test.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs
    jwtIssuer: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    jwtAudience: connected-services-submit-6349
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Files and templates in S3; credentials and bucket come from Vault.
  storage:
    defaultBackend: storage-s3
    defaultPrefix: test
    s3VaultKeyInfix: TEST
  config:
    nodeEnv: production
    documentGenerationDefaultCode: cdogs-v2
    tenantEngineDefaultCode: cstar-v1
    notificationDefaultCode: notify-v1
    userSearchPlugins: css-v1,user-search-soba
    # Emails go through Notify test, which only delivers to its safelist.
    postSubmissionActionPlugins: post-submission-email-addresses
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs-test.api.gov.bc.ca/api
      tokenUrl: https://test.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
    cdogsV3:
      endpoint: http://common-document-generation-service-master.a12c97-prod:3000
  tenantEngine:
    cstarV1:
      apiBaseUrl: https://test.connect.digital.gov.bc.ca/api/v1
  workflowEngine:
    csWorkflowV1:
      apiBaseUrl: https://test-workflow.apps.gold.devops.gov.bc.ca/api/v1
  notification:
    notifyV1:
      endpoint: https://gw-fe8c5-notify.test.api.gov.bc.ca/api/v1
      # Keeps one slow send well inside an email job's lease and timeout.
      timeoutMs: "10000"
  userSearch:
    cssV1:
      apiBaseUrl: https://api.loginproxy.gov.bc.ca/api/v1
      environment: test
      tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token

frontend:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

formio:
  internal:
    enabled: true
  replicas: 2
  nodeOptions: "--max-old-space-size=2048"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 3Gi

mongodb:
  # MongoDB runs as its own release from deployments/helm/action-mongodb.
  # release-to-test.yaml supplies external.host and external.authSecretName.
  internal:
    enabled: false
  replicas: 1
  persistence:
    size: 2Gi

vault:
  enabled: true
  role: acf456-nonprod
  secretPath: acf456-nonprod/soba-test
  serviceAccountName: acf456-vault
