# Test / UAT environment — two replicas, moderate resources
backend:
  # Development data generator: on in test, for integration runs.
  features:
    dev-data: "enabled"
  replicas: 2
  sso:
    jwksUri: https://test.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/certs
    jwtIssuer: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    jwtAudience: connected-services-submit-6349
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    nodeEnv: production
    documentGenerationDefaultCode: cdogs-v2
  storage:
    # 'default' profile stays on storage-memory (inherited); templates gets its own profile below.
    profiles: "default,templates"
  templateStorage:
    # Local PVC for now; revisit storage-s3 once durable multi-replica storage is needed.
    enabled: true
    backend: storage-local
    basePath: /app/templates
    persistence:
      enabled: true
      mountPath: /app/templates
      accessMode: ReadWriteMany
      size: 1Gi
  documentGeneration:
    templateStorageProfile: templates
    cdogsV2:
      endpoint: https://cdogs-test.api.gov.bc.ca/api
      tokenUrl: https://test.loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
    cdogsV3:
      endpoint: http://common-document-generation-service-master.a12c97-prod:3000

frontend:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

formio:
  internal:
    enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

mongodb:
  internal:
    enabled: true
  replicas: 1
  persistence:
    size: 2Gi

vault:
  enabled: true
  role: acf456-nonprod
  secretPath: acf456-nonprod/soba-test
  serviceAccountName: acf456-vault
