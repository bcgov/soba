# UAT environment — production-like sizing and external service topology.
backend:
  # Integration API v2 through the Gold APS gateway. The audience is the Kong service the gateway
  # check publishes for this release, <release>-integrations-v2.
  integrationGateway:
    issuer: https://aps-jwks-upstream-jwt.api.gov.bc.ca
    jwksUri: https://aps-jwks-upstream-jwt.api.gov.bc.ca/certs
    audience: soba-uat-integrations-v2
    clientIdClaim: consumername
    publicUrl: https://soba-uat.api.gov.bc.ca/integrations/v2
  features:
    confirmation-email-copy: "disabled"
    confirmation-id-visibility: "disabled"
    confirmation-screen: "disabled"
    dev-data: "disabled"
    notifications: "disabled"
    post-submission: "enabled"
    post-submission-email: "enabled"
    submission-export: "disabled"
    user-search: "disabled"
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
  config:
    nodeEnv: production
    logLevel: warn
    documentGenerationDefaultCode: cdogs-v2
    # Email jobs end cancelled while notifications are disabled. Sending needs the notifications
    # feature enabled, notificationDefaultCode notify-v1, notification.notifyV1.endpoint, and
    # PLUGIN_NOTIFY_V1_API_KEY in the Vault secret.
    postSubmissionActionPlugins: post-submission-email-addresses
  notification:
    notifyV1:
      # Keeps one slow send well inside an email job's lease and timeout.
      timeoutMs: "10000"
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs.api.gov.bc.ca/api
      tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token

frontend:
  replicas: 3
  resources:
    requests:
      cpu: 85m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

formio:
  internal:
    enabled: true
  replicas: 2
  nodeOptions: "--max-old-space-size=2048"
  resources:
    requests:
      cpu: 150m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 3Gi

mongodb:
  internal:
    enabled: false
  external:
    uri: ""
    authSecretName: soba-uat-mongodb-auth

gatewayNetworkPolicy:
  enabled: true
  namespaceName: "b8840c"
  environment: prod

vault:
  enabled: true
