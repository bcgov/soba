# UAT environment — production-like sizing and external service topology.
backend:
  features:
    dev-data: "disabled"
    notifications: "disabled"
    user-search: "disabled"
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  # Files and templates in S3; credentials and bucket come from Vault.
  storage:
    defaultBackend: storage-s3
    defaultPrefix: uat
    s3VaultKeyInfix: UAT
  config:
    nodeEnv: production
    logLevel: warn
    documentGenerationDefaultCode: cdogs-v2
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs.api.gov.bc.ca/api
      tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
    cdogsV3:
      endpoint: http://common-document-generation-service-master.a12c97-prod:3000

frontend:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

formio:
  internal:
    enabled: true
  replicas: 2
  nodeOptions: "--max-old-space-size=384"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

mongodb:
  internal:
    enabled: false
  external:
    uri: ""

vault:
  enabled: true
