# Production — higher replicas, resources, HPA enabled, external Form.io likely
backend:
  # Development data generator: stated explicitly rather than left to the default.
  features:
    dev-data: "disabled"
    notifications: "disabled"
    post-submission: "enabled"
    post-submission-email: "enabled"
    user-search: "disabled"
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  # Files and templates in S3; credentials and bucket come from Vault.
  storage:
    defaultBackend: storage-s3
    defaultPrefix: prod
    s3VaultKeyInfix: PROD
  config:
    nodeEnv: production
    logLevel: warn
    documentGenerationDefaultCode: cdogs-v2
    tenantEngineDefaultCode: cstar-v1
    # Email jobs end cancelled while notifications are disabled. Sending needs the notifications
    # feature enabled, notificationDefaultCode notify-v1, notification.notifyV1.endpoint, and
    # PLUGIN_NOTIFY_V1_API_KEY in the Vault secret.
    postSubmissionActionPlugins: post-submission-email-addresses
  notification:
    notifyV1:
      # Keeps one slow send well inside an email job's lease and timeout.
      timeoutMs: "10000"
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs.api.gov.bc.ca/api
      tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
  tenantEngine:
    cstarV1:
      apiBaseUrl: https://connect.digital.gov.bc.ca/api/v1
  workflowEngine:
    csWorkflowV1:
      apiBaseUrl: https://workflow.apps.gold.devops.gov.bc.ca/api/v1

frontend:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

# Typically external in production; set formio.internal.enabled=false and
# formio.external.url to the shared Form.io instance.
formio:
  internal:
    enabled: false
  external:
    url: ""

mongodb:
  internal:
    enabled: false
  external:
    uri: ""

# The prod deploy supplies vault.role, vault.secretPath and vault.serviceAccountName.
vault:
  enabled: true
