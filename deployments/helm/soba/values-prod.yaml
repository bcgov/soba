# Production — higher replicas, resources, HPA enabled, external Form.io likely
backend:
  # Development data generator: stated explicitly rather than left to the default.
  features:
    confirmation-email-copy: "disabled"
    confirmation-id-visibility: "disabled"
    confirmation-screen: "disabled"
    dev-data: "disabled"
    notifications: "disabled"
    post-submission: "enabled"
    post-submission-email: "enabled"
    submission-export: "disabled"
    user-search: "disabled"
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  config:
    nodeEnv: production
    logLevel: warn
    documentGenerationDefaultCode: cdogs-v2
    tenantEngineDefaultCode: cstar-v1
    # Switch to aps-credential-issuer-v3 after adding the Vault keys.
    credentialIssuerDefaultCode: credential-issuer-noop
    # Email jobs end cancelled while notifications are disabled. Sending needs the notifications
    # feature enabled, notificationDefaultCode notify-v1, notification.notifyV1.endpoint, and
    # PLUGIN_NOTIFY_V1_API_KEY in the Vault secret.
    postSubmissionActionPlugins: post-submission-email-addresses

    ## These were unset as of Nov 19, 2026
    cacheDefaultCode: cache-redis
    messagebusDefaultCode: messagebus-redis
    eventStreamDefaultCode: eventstream-redis
    workflowEngineDefaultCode: cs-workflow-v1
    notificationDefaultCode: notify-v1
    userSearchPlugins: css-v1,user-search-soba

  notification:
    notifyV1:
      # Keeps one slow send well inside an email job's lease and timeout.
      timeoutMs: "10000"
  credentialIssuer:
    apsCredentialIssuerV3:
      apiBaseUrl: https://api.gov.bc.ca/ds/api/v3
      gatewayId: "gw-6cd63"
      tokenUrl: https://authz.apps.gov.bc.ca/auth/realms/aps/protocol/openid-connect/token
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs.api.gov.bc.ca/api
      tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
  tenantEngine:
    cstarV1:
      apiBaseUrl: https://connect.digital.gov.bc.ca/api/v1
  workflowEngine:
    csWorkflowV1:
      apiBaseUrl: https://workflow.apps.gold.devops.gov.bc.ca/api/v1

frontend:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

formio:
  internal:
    enabled: true
  replicas: 2
  nodeOptions: "--max-old-space-size=2048"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 3Gi

mongodb:
  internal:
    enabled: false
  external:
    uri: ""
    authSecretName: soba-prod-mongodb-auth

gatewayNetworkPolicy:
  enabled: true
  namespaceName: "b8840c"
  environment: prod

# The prod deploy supplies vault.role, vault.secretPath and vault.serviceAccountName.
vault:
  enabled: true
