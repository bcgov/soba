# Production — higher replicas, resources, HPA enabled, external Form.io likely
backend:
  # Development data generator: stated explicitly rather than left to the default.
  features:
    dev-data: "disabled"
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  config:
    nodeEnv: production
    logLevel: warn
    documentGenerationDefaultCode: cdogs-v2
  storage:
    # 'default' profile stays on storage-memory (inherited); templates gets its own profile below.
    profiles: "default,templates"
  templateStorage:
    # Local PVC for now; revisit storage-s3 once durable multi-replica storage is needed (this PVC
    # must be ReadWriteMany-capable since backend.replicas > 1 here).
    enabled: true
    backend: storage-local
    basePath: /app/templates
    persistence:
      enabled: true
      mountPath: /app/templates
      accessMode: ReadWriteMany
      size: 1Gi
  documentGeneration:
    cdogsV2:
      endpoint: https://cdogs.api.gov.bc.ca/api
      tokenUrl: https://loginproxy.gov.bc.ca/auth/realms/comsvcauth/protocol/openid-connect/token
    cdogsV3:
      endpoint: http://common-document-generation-service-master.a12c97-prod:3000

frontend:
  replicas: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

# Typically external in production; set formio.internal.enabled=false and
# formio.external.url to the shared Form.io instance.
formio:
  internal:
    enabled: false
  external:
    url: ""

mongodb:
  internal:
    enabled: false
  external:
    uri: ""
