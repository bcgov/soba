name: Promote UAT to Prod
run-name: Promote ${{ inputs.source_commit_sha }} to Prod

on:
  workflow_dispatch:
    inputs:
      source_commit_sha:
        description: Full source commit SHA of the approved UAT images
        required: true
        type: string

permissions: {}

concurrency:
  group: openshift-prod
  cancel-in-progress: false

env:
  ACRONYM: soba
  OC_VERSION: "4.14"
  REGISTRY: ghcr.io

jobs:
  set-vars:
    name: Validate production source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.tags.outputs.source_sha }}
      short_sha: ${{ steps.tags.outputs.short_sha }}
      release_tag: ${{ steps.tags.outputs.release_tag }}
      image_tag: ${{ steps.tags.outputs.image_tag }}
      uat_tag: ${{ steps.tags.outputs.uat_tag }}
      prod_tag: ${{ steps.tags.outputs.prod_tag }}
    steps:
      - name: Require main and a full source SHA
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.source_commit_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production promotion must run from main."
            exit 1
          fi
          if ! [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Provide the full 40-character source commit SHA."
            exit 1
          fi

      - name: Checkout approved UAT source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit_sha }}

      - name: Derive tags using the release build's short SHA format
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(jq -r .version package.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          for manifest in backend/package.json frontend/package.json lib/package.json; do
            [ "$(jq -r .version "$manifest")" = "$VERSION" ] || exit 1
          done
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s-%s\n' "$VERSION" "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'uat_tag=soba-uat-%s\n' "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'prod_tag=soba-prod-%s\n' "$SHORT_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy promoted images to Prod
    needs: [set-vars]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      statuses: read
    environment:
      name: prod
      url: https://${{ env.ACRONYM }}-prod.${{ vars.OC_DOMAIN }}/designer
    env:
      NAMESPACE: ${{ vars.OC_NAMESPACE }}
      OC_SERVER: ${{ vars.OC_SERVER }}
      OC_TOKEN: ${{ secrets.OC_TOKEN }}
      OC_DOMAIN: ${{ vars.OC_DOMAIN }}
      CRUNCHY_CLUSTER: pg-soba-prod-crunchy
      MONGODB_HOST: ${{ vars.MONGODB_HOST }}
      MONGODB_PORT: ${{ vars.MONGODB_PORT || '27017' }}
      MONGODB_USERNAME: ${{ vars.MONGODB_USERNAME || 'formio' }}
      MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE || 'formio-ce' }}
      MONGODB_AUTH_SOURCE: ${{ vars.MONGODB_AUTH_SOURCE || 'formio-ce' }}
      MONGODB_REPLICA_SET: ${{ vars.MONGODB_REPLICA_SET || 'rs0' }}
      VAULT_AUTH_PATH: ${{ vars.VAULT_AUTH_PATH }}
      VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}
      VAULT_ROLE: ${{ vars.VAULT_ROLE_PROD }}
      VAULT_SECRET_PATH: ${{ vars.VAULT_SECRET_PATH }}
      VAULT_SERVICE_ACCOUNT_NAME: ${{ vars.VAULT_SERVICE_ACCOUNT_NAME }}
      SOURCE_SHA: ${{ needs.set-vars.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.set-vars.outputs.release_tag }}
      IMAGE_TAG: ${{ needs.set-vars.outputs.image_tag }}
      UAT_TAG: ${{ needs.set-vars.outputs.uat_tag }}
      PROD_TAG: ${{ needs.set-vars.outputs.prod_tag }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout production deployment chart from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: ${{ env.OC_VERSION }}

      - name: Authenticate to OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ env.OC_SERVER }}
          openshift_token: ${{ env.OC_TOKEN }}
          namespace: ${{ env.NAMESPACE }}

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${NAMESPACE:?Set OC_NAMESPACE on the prod environment.}"
          : "${OC_SERVER:?Set OC_SERVER on the prod environment.}"
          : "${OC_DOMAIN:?Set OC_DOMAIN on the prod environment.}"
          : "${CRUNCHY_CLUSTER:?Set CRUNCHY_CLUSTER to the production Crunchy cluster name.}"
          : "${MONGODB_HOST:?Set MONGODB_HOST on the prod environment.}"
          : "${VAULT_AUTH_PATH:?Set the production VAULT_AUTH_PATH.}"
          : "${VAULT_NAMESPACE:?Set the production VAULT_NAMESPACE.}"
          : "${VAULT_ROLE:?Set VAULT_ROLE_PROD.}"
          : "${VAULT_SECRET_PATH:?Set the production VAULT_SECRET_PATH.}"
          : "${VAULT_SERVICE_ACCOUNT_NAME:?Set the production VAULT_SERVICE_ACCOUNT_NAME.}"
          MONGODB_AUTH_SECRET_NAME=$(ruby -ryaml -e 'puts YAML.load_file(ARGV.fetch(0)).dig("mongodb", "external", "authSecretName")' deployments/helm/soba/values-prod.yaml)
          : "${MONGODB_AUTH_SECRET_NAME:?Set mongodb.external.authSecretName in values-prod.yaml.}"
          if [[ "$NAMESPACE" != *-prod ]]; then
            echo "::error::Production namespace must end in -prod."
            exit 1
          fi
          oc -n "$NAMESPACE" get secret "${CRUNCHY_CLUSTER}-pguser-app" -o json |
            jq -e '.data.uri != null' >/dev/null
          oc -n "$NAMESPACE" get secret "${CRUNCHY_CLUSTER}-pguser-appproxy" -o json |
            jq -e '.data["pgbouncer-uri"] != null' >/dev/null
          oc -n "$NAMESPACE" get secret "$MONGODB_AUTH_SECRET_NAME" -o json |
            jq -e '.data["mongodb-passwords"] != null' >/dev/null
          oc -n "$NAMESPACE" get serviceaccount "$VAULT_SERVICE_ACCOUNT_NAME" >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify sources and copy manifests to Prod tags
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY_LOWER="${REPOSITORY,,}"
          IMAGE_ROOT="$REGISTRY/$REPOSITORY_LOWER"

          if TAG_SHA=$(gh api "repos/$REPOSITORY/git/ref/tags/v$RELEASE_TAG" \
            --jq .object.sha 2>"$RUNNER_TEMP/tag-error"); then
            [ "$TAG_SHA" = "$SOURCE_SHA" ] || {
              echo "::error::Version v$RELEASE_TAG is already finalized from another source."
              exit 1
            }
          elif ! grep -Eqi 'HTTP 404|Not Found' "$RUNNER_TEMP/tag-error"; then
            cat "$RUNNER_TEMP/tag-error" >&2
            exit 1
          fi

          RELEASE_STATUSES=$(gh api "repos/$REPOSITORY/commits/$SOURCE_SHA/status?per_page=100")
          [ "$(jq -r '[.statuses[] | select(.context == "soba/release-test")][0].state // empty' <<< "$RELEASE_STATUSES")" = success ] || {
            echo "::error::The release source has not passed TEST validation."
            exit 1
          }
          UAT_STATUS=$(jq -r '[.statuses[] | select(.context == "soba/release-uat")][0] | select(.state == "success") | .description // empty' <<< "$RELEASE_STATUSES")
          [ "$UAT_STATUS" = "UAT validated $RELEASE_TAG image $IMAGE_TAG" ] || {
            echo "::error::The exact source and version have not passed UAT deployment and gateway validation."
            exit 1
          }

          digest() {
            local image_ref="$1"
            docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          }

          # The frontend suffix is part of each image tag, not the Helm base tag.
          images=("backend|" "frontend|-designer" "frontend|-forms" "temporal-worker|")
          for entry in "${images[@]}"; do
            IFS='|' read -r image suffix <<< "$entry"
            source="$IMAGE_ROOT/$image:$UAT_TAG$suffix"
            source_digest=$(digest "$source") || {
              echo "::error::Missing or unreadable UAT source: $source"
              exit 1
            }
            release_digest=$(digest "$IMAGE_ROOT/$image:$IMAGE_TAG$suffix") || {
              echo "::error::Missing or unreadable release source: $IMAGE_TAG$suffix"
              exit 1
            }
            [ "$source_digest" = "$release_digest" ] || {
              echo "::error::UAT and release source digests differ for $image$suffix."
              exit 1
            }
            for context in "soba/release-digest/$image$suffix" "soba/uat-digest/$image$suffix"; do
              approved_digest=$(jq -r --arg context "$context" \
                '[.statuses[] | select(.context == $context)][0] | select(.state == "success") | .description // empty' \
                <<< "$RELEASE_STATUSES")
              [ "$source_digest" = "$approved_digest" ] || {
                echo "::error::UAT source differs from approved digest in $context."
                exit 1
              }
            done
            printf '%s|%s|%s\n' "$image" "$suffix" "$source_digest" >> "$RUNNER_TEMP/prod-images"
          done

          # Check every existing destination before changing any tag.
          while IFS='|' read -r image suffix source_digest; do
            target="$IMAGE_ROOT/$image:$PROD_TAG$suffix"
            if target_digest=$(digest "$target" 2>"$RUNNER_TEMP/target-error"); then
              if [ "$target_digest" != "$source_digest" ]; then
                echo "::error::Refusing to overwrite a different digest: $target"
                exit 1
              fi
            elif ! grep -Eqi 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/target-error"; then
              cat "$RUNNER_TEMP/target-error" >&2
              echo "::error::Could not determine whether $target already exists."
              exit 1
            fi
          done < "$RUNNER_TEMP/prod-images"

          while IFS='|' read -r image suffix source_digest; do
            target="$IMAGE_ROOT/$image:$PROD_TAG$suffix"
            if target_digest=$(digest "$target" 2>"$RUNNER_TEMP/target-error"); then
              if [ "$target_digest" != "$source_digest" ]; then
                echo "::error::Refusing to overwrite a changed digest: $target"
                exit 1
              fi
            else
              if ! grep -Eqi 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/target-error"; then
                cat "$RUNNER_TEMP/target-error" >&2
                exit 1
              fi
              docker buildx imagetools create -t "$target" "$IMAGE_ROOT/$image@$source_digest"
            fi
            if [ "$(digest "$target")" != "$source_digest" ]; then
              echo "::error::Source and production digests differ: $target"
              exit 1
            fi
          done < "$RUNNER_TEMP/prod-images"

      - name: Recover pending Helm release
        if: hashFiles('.github/actions/recover-helm-release/action.yaml') != ''
        uses: ./.github/actions/recover-helm-release
        with:
          release: soba-prod
          namespace: ${{ env.NAMESPACE }}

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY_LOWER="${REPOSITORY,,}"
          helm upgrade --install "$ACRONYM-prod" ./deployments/helm/soba \
            --namespace "$NAMESPACE" \
            --wait \
            --wait-for-jobs \
            --timeout 900s \
            -f deployments/helm/soba/values-prod.yaml \
            --set-string "backend.image.repository=ghcr.io/$REPOSITORY_LOWER/backend" \
            --set-string "backend.image.tag=$PROD_TAG" \
            --set-string "backend.config.appVersion=$RELEASE_TAG" \
            --set-string "backend.config.gitSha=$SOURCE_SHA" \
            --set-string "backend.config.gitTag=$PROD_TAG" \
            --set-string "backend.config.imageTag=$PROD_TAG" \
            --set-string "frontend.image.repository=ghcr.io/$REPOSITORY_LOWER/frontend" \
            --set-string "frontend.image.tag=$PROD_TAG" \
            --set-string "temporalWorkersImage.repository=ghcr.io/$REPOSITORY_LOWER/temporal-worker" \
            --set-string "temporalWorkersImage.tag=$PROD_TAG" \
            --set-string "temporalWorkersImage.pullPolicy=IfNotPresent" \
            --set-string "global.domain=$OC_DOMAIN" \
            --set-string "database.existingSecretName=${CRUNCHY_CLUSTER}-pguser-app" \
            --set-string "database.existingSecretKey=uri" \
            --set-string "database.runtimeSecretName=${CRUNCHY_CLUSTER}-pguser-appproxy" \
            --set-string "database.runtimeSecretKey=pgbouncer-uri" \
            --set-string "database.runtimeRole=appproxy" \
            --set-string "mongodb.external.host=$MONGODB_HOST" \
            --set-string "mongodb.external.port=$MONGODB_PORT" \
            --set-string "mongodb.external.username=$MONGODB_USERNAME" \
            --set-string "mongodb.external.database=$MONGODB_DATABASE" \
            --set-string "mongodb.external.authSource=$MONGODB_AUTH_SOURCE" \
            --set-string "mongodb.external.replicaSet=$MONGODB_REPLICA_SET" \
            --set-string "vault.authPath=$VAULT_AUTH_PATH" \
            --set-string "vault.namespace=$VAULT_NAMESPACE" \
            --set-string "vault.role=$VAULT_ROLE" \
            --set-string "vault.secretPath=$VAULT_SECRET_PATH" \
            --set-string "vault.serviceAccountName=$VAULT_SERVICE_ACCOUNT_NAME"

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Release version: \`v${RELEASE_TAG}\`"
            echo "- Production tag: \`${PROD_TAG}\`"
            echo "- Namespace: \`${NAMESPACE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  gateway:
    name: Verify Prod through APS gateway
    needs: [deploy]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gateway-proxy-check.yaml
    with:
      environment: prod
      release: soba-prod
    secrets: inherit

  finalize-release:
    name: Tag verified production release
    needs: [set-vars, gateway]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create final Git version tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.set-vars.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.set-vars.outputs.release_tag }}
        run: |
          set -euo pipefail
          GIT_TAG="v$RELEASE_TAG"
          if existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GIT_TAG" \
            --jq .object.sha 2>"$RUNNER_TEMP/tag-error"); then
            [ "$existing_sha" = "$SOURCE_SHA" ] || {
              echo "::error::Finalized version $GIT_TAG belongs to another source commit."
              exit 1
            }
          else
            if ! grep -Eqi 'HTTP 404|Not Found' "$RUNNER_TEMP/tag-error"; then
              cat "$RUNNER_TEMP/tag-error" >&2
              exit 1
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$GIT_TAG" -f "sha=$SOURCE_SHA" >/dev/null
          fi
