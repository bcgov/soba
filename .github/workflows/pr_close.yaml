# PR close: remove SOBA, then PR MongoDB, then Crunchy PR user/database.
# Runs on PR close or manually with a PR number.
name: PR Close
run-name: Cleanup PR-${{ github.event.pull_request.number || github.event.inputs.pr_number }}

on:
  pull_request:
    types: [closed]
    branches:
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/pr_open.yaml"
      - ".github/workflows/pr_close.yaml"
      - ".github/workflows/build-images.yaml"
      - ".gitignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deployments/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to clean up (e.g. 42)"
        required: true
        type: number

permissions: {}

concurrency:
  group: openshift-deploy
  cancel-in-progress: false

jobs:
  set-vars:
    name: Set variables
    runs-on: ubuntu-24.04
    outputs:
      PR_NUM: ${{ steps.vars.outputs.PR_NUM }}
      JOB_NAME: ${{ steps.vars.outputs.JOB_NAME }}
      RELEASE: ${{ steps.vars.outputs.RELEASE }}
    steps:
      - name: Setting variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
          fi
          echo "PR_NUM=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "JOB_NAME=pr-$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "RELEASE=soba-pr-$PR_NUM" >> "$GITHUB_OUTPUT"

  soba-cleanup:
    name: Uninstall SOBA and remove secrets/PVCs
    needs: [set-vars]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: "4.14"
          skip_cache: "true"

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ secrets.OC_NAMESPACE }}

      - name: Uninstall SOBA and delete orphaned resources
        env:
          RELEASE: ${{ needs.set-vars.outputs.RELEASE }}
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
        run: |
          set -euo pipefail

          LABEL="app.kubernetes.io/instance=${RELEASE}"

          if helm status "${RELEASE}" -n "${NAMESPACE}" &>/dev/null; then
            echo "Uninstalling Helm release ${RELEASE}..."
            helm uninstall "${RELEASE}" --namespace "${NAMESPACE}"
          else
            echo "Release ${RELEASE} not found, sweeping orphaned resources."
          fi

          echo "Sweeping all resources with label ${LABEL}..."
          oc delete all,secret,pvc,configmap,serviceaccount,networkpolicy \
            -l "${LABEL}" \
            -n "${NAMESPACE}" \
            --ignore-not-found

      - name: Delete Temporal PR namespace
        env:
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          PR_NUM: ${{ needs.set-vars.outputs.PR_NUM }}
        run: |
          TEMPORAL_NS="soba-pr-${PR_NUM}"
          if oc get deployment temporal-admintools -n "${NAMESPACE}" &>/dev/null; then
            oc exec deployment/temporal-admintools -n "${NAMESPACE}" -- \
              temporal operator namespace delete -n "${TEMPORAL_NS}" --yes 2>/dev/null || true
          fi

  mongo-cleanup:
    name: Remove PR MongoDB
    needs: [set-vars, soba-cleanup]
    runs-on: ubuntu-24.04
    steps:
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: "4.14"
          skip_cache: "true"

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ secrets.OC_NAMESPACE }}

      - name: Uninstall MongoDB and delete orphaned resources
        env:
          NAMESPACE: ${{ secrets.OC_NAMESPACE }}
          PR_NUM: ${{ needs.set-vars.outputs.PR_NUM }}
        run: |
          set -euo pipefail

          MONGO_RELEASE="soba-pr-${PR_NUM}-mongodb"
          MONGO_LABEL="app.kubernetes.io/instance=${MONGO_RELEASE}"

          if helm status "${MONGO_RELEASE}" -n "${NAMESPACE}" &>/dev/null; then
            echo "Uninstalling MongoDB Helm release ${MONGO_RELEASE}..."
            helm uninstall "${MONGO_RELEASE}" --namespace "${NAMESPACE}"
          else
            echo "MongoDB release ${MONGO_RELEASE} not found, sweeping orphaned resources."
          fi

          echo "Sweeping MongoDB resources with label ${MONGO_LABEL}..."
          oc delete all,pvc,configmap,serviceaccount,networkpolicy,poddisruptionbudget \
            -l "${MONGO_LABEL}" \
            -n "${NAMESPACE}" \
            --ignore-not-found

  crunch-cleanup:
    name: Remove Crunchy PR user and database
    needs: [set-vars, mongo-cleanup]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout action-crunchy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bcgov/action-crunchy
          ref: v2.0.0

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: "4.14"
          skip_cache: "true"

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ secrets.OC_NAMESPACE }}

      - name: Remove PR user from Crunchy
        run: |
          ./scripts/user_change.sh remove "${{ needs.set-vars.outputs.PR_NUM }}" "pg-soba-crunchy"
