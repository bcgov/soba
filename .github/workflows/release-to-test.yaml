# Deploy release branches to the OpenShift test environment.
name: Release to Test
run-name: Deploy ${{ github.event.inputs.release_branch || github.ref_name }} to Test

env:
  ACRONYM: soba
  OC_VERSION: "4.14"

on:
  push:
    branches:
      - "release/s*-r*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "lib/**"
      - ".github/workflows/release-to-test.yaml"
      - ".github/workflows/build-images.yaml"
      - ".github/workflows/playwright.yaml"
      - "integration/playwright/**"
      - ".gitignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deployments/**"
  create:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to deploy, for example release/s10-r1"
        required: true
        type: string

permissions: {}

concurrency:
  group: openshift-test
  cancel-in-progress: false

jobs:
  set-vars:
    name: Set release variables
    # The create event is emitted for every new branch and tag; only release
    # branches should start this deployment workflow.
    if: >-
      (github.event_name != 'create' ||
      (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/s'))) &&
      (github.event_name != 'push' || github.event.created != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.vars.outputs.ref }}
      branch: ${{ steps.vars.outputs.branch }}
    steps:
      - name: Validate release branch
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.release_branch }}"
          elif [ "${{ github.event_name }}" = "create" ]; then
            BRANCH="${{ github.event.ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if ! echo "$BRANCH" | grep -Eq '^release/s[0-9]+-r[0-9]+$'; then
            echo "Branch '$BRANCH' does not match release/s<sprint>-r<release>."
            exit 1
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ref=refs/heads/$BRANCH" >> "$GITHUB_OUTPUT"

  version:
    name: Version release commit
    needs: [set-vars]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      image_version: ${{ steps.version.outputs.image_version }}
    steps:
      - name: Checkout release branch and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm

      - name: Install existing release-it dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate and commit release version
        id: version
        shell: bash
        env:
          BRANCH: ${{ needs.set-vars.outputs.branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin develop --tags
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ "$HEAD_SHA" != "$EVENT_SHA" ]; then
            MESSAGE=$(git log -1 --format=%s)
            if [ "$(git rev-parse HEAD^)" != "$EVENT_SHA" ] ||
               [[ "$MESSAGE" != "chore(release): version "*" from $EVENT_SHA" ]]; then
              echo "::error::Release branch moved since this event; rerun from its current head."
              exit 1
            fi
          fi

          BUMP=none
          if [ "$HEAD_SHA" = "$EVENT_SHA" ] && [ "$EVENT_NAME" = create ]; then
            if ! git merge-base --is-ancestor "$HEAD_SHA" origin/develop; then
              echo "::error::New release branch commit is not in develop history."
              exit 1
            fi
            LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '1p' || true)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$' | sed -n '1p' || true)
            fi
            : "${LATEST_TAG:?No finalized version tag is reachable from develop.}"
            git merge-base --is-ancestor "$LATEST_TAG" HEAD || {
              echo "::error::Latest finalized release is not in develop; back-merge main first."
              exit 1
            }
            COMMITS=$(git log --format='%B%n---SOBA-COMMIT---' "$LATEST_TAG"..HEAD)
            SUBJECTS=$(git log --format='%s' "$LATEST_TAG"..HEAD)
            BASE_VERSION=${LATEST_TAG#v}
          elif [ "$HEAD_SHA" = "$EVENT_SHA" ] && [ "$EVENT_NAME" = push ]; then
            PR_NUMBER=""
            COMMITS=""
            SUBJECTS=""
            if [ "$(git rev-list --parents -n 1 "$EVENT_SHA" | awk '{print NF - 1}')" -gt 1 ]; then
              for attempt in 1 2 3 4 5; do
                PRS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EVENT_SHA/pulls?per_page=100")
                PR_NUMBER=$(jq -r --arg branch "$BRANCH" --arg sha "$EVENT_SHA" \
                  '[.[] | select(.merged_at != null and .base.ref == $branch and .merge_commit_sha == $sha)] | if length == 1 then .[0].number else empty end' <<< "$PRS")
                [ -n "$PR_NUMBER" ] && break
                [ "$attempt" -eq 5 ] || sleep 2
              done
              [ -n "$PR_NUMBER" ] || {
                echo "::error::Merge commit has no identifiable merged PR; refusing an unversioned build."
                exit 1
              }
              PR_TITLE=$(jq -r --arg branch "$BRANCH" --arg sha "$EVENT_SHA" \
                '[.[] | select(.merged_at != null and .base.ref == $branch and .merge_commit_sha == $sha)][0].title // empty' <<< "$PRS")
              [ -n "$PR_TITLE" ] || { echo "::error::Merged PR has no title."; exit 1; }
              PR_COMMITS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100")
              COMMITS=$(printf '%s\n%s\n' "$PR_TITLE" "$(jq -r '.[].commit.message' <<< "$PR_COMMITS")")
              SUBJECTS=$(printf '%s\n%s\n' "$PR_TITLE" "$(jq -r '.[].commit.message | split("\n")[0]' <<< "$PR_COMMITS")")
            fi
            BASE_VERSION=$(jq -r .version package.json)
          else
            COMMITS=""
            SUBJECTS=""
            BASE_VERSION=$(jq -r .version package.json)
          fi

          for manifest in backend/package.json frontend/package.json lib/package.json; do
            [ "$(jq -r .version "$manifest")" = "$(jq -r .version package.json)" ] || {
              echo "::error::Application package versions are not synchronized."
              exit 1
            }
          done
          if [ "$EVENT_NAME" = create ] && [ "$HEAD_SHA" = "$EVENT_SHA" ] &&
             [ "$(jq -r .version package.json)" != "$BASE_VERSION" ]; then
            echo "::error::develop application version differs from the latest finalized tag; back-merge main first."
            exit 1
          fi

          if grep -Eq '^BREAKING[ -]CHANGE:|^[a-z]+(\([^)]*\))?!:' <<< "$COMMITS"; then
            BUMP=major
          elif grep -Eq '^feat(\([^)]*\))?:' <<< "$SUBJECTS"; then
            BUMP=minor
          elif grep -Eq '^fix(\([^)]*\))?:' <<< "$SUBJECTS"; then
            BUMP=patch
          fi

          NEXT_VERSION="$BASE_VERSION"
          if [ "$EVENT_NAME" = create ] && [ "$HEAD_SHA" = "$EVENT_SHA" ] &&
             [[ "$BASE_VERSION" == *-* ]] && [ "$BUMP" = none ]; then
            NEXT_VERSION=${BASE_VERSION%%-*}
          elif [ "$BUMP" != none ]; then
            STABLE=${BASE_VERSION%%-*}
            IFS=. read -r MAJOR MINOR PATCH <<< "$STABLE"
            case "$BUMP" in
              major) NEXT_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEXT_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) if [[ "$BASE_VERSION" == *-* ]]; then NEXT_VERSION="$STABLE";
                     else NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"; fi ;;
              *) echo "::error::Unexpected version bump: $BUMP"; exit 1 ;;
            esac
          fi

          if [ "$EVENT_NAME" = create ] && [ "$HEAD_SHA" = "$EVENT_SHA" ] &&
             [ "$NEXT_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::No new version is due since the latest finalized release."
            exit 1
          fi

          if [ "$NEXT_VERSION" != "$(jq -r .version package.json)" ]; then
            if git show-ref --verify --quiet "refs/tags/v$NEXT_VERSION"; then
              echo "::error::Application version $NEXT_VERSION is already finalized."
              exit 1
            fi
            RELEASE_REFS=$(git ls-remote --heads origin 'refs/heads/release/s*-r*')
            while read -r _ other_ref; do
              [ -n "$other_ref" ] || continue
              other_branch=${other_ref#refs/heads/}
              [ "$other_branch" = "$BRANCH" ] && continue
              encoded=$(jq -rn --arg branch "$other_branch" '$branch | @uri')
              other_version=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$encoded" \
                --jq .content | base64 -d | jq -r .version)
              if [ "$other_version" = "$NEXT_VERSION" ]; then
                echo "::error::Application version $NEXT_VERSION is already in $other_branch."
                exit 1
              fi
            done <<< "$RELEASE_REFS"
            pnpm exec release-it "$NEXT_VERSION" --ci
            for manifest in package.json backend/package.json frontend/package.json lib/package.json; do
              [ "$(jq -r .version "$manifest")" = "$NEXT_VERSION" ] || exit 1
            done
            git diff --name-only | grep -Ev '^(package.json|backend/package.json|frontend/package.json|lib/package.json)$' && {
              echo "::error::release-it changed a file outside the four application manifests."
              exit 1
            }
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json backend/package.json frontend/package.json lib/package.json
            git commit -m "chore(release): version $NEXT_VERSION from $EVENT_SHA"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          BUILT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(jq -r .version package.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release builds require a stable application version."
            exit 1
          }
          printf 'ref=%s\nimage_version=%s-%s\n' "$BUILT_SHA" "$VERSION" "$SHORT_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push
    uses: ./.github/workflows/build-images.yaml
    needs: [version]
    with:
      ref: ${{ needs.version.outputs.ref }}
      platforms: amd64
      image_version: ${{ needs.version.outputs.image_version }}
      publish_latest: false
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy-crunchy:
    name: Deploy Crunchy Postgres
    needs: [set-vars]
    environment:
      name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      cluster: ${{ steps.crunchy.outputs.cluster }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Deploy Crunchy
        id: crunchy
        uses: bcgov/actions-openshift/crunchy@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          oc_server: ${{ vars.OC_SERVER }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.OC_TOKEN }}
          values_file: deployments/helm/action-crunchy/values-test.yaml
          release_name: pg-soba-test

  deploy-mongodb:
    name: Deploy MongoDB
    needs: [set-vars]
    permissions:
      contents: read
    environment:
      name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: ${{ env.OC_VERSION }}

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Validate MongoDB auth secret
        env:
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
        run: |
          set -euo pipefail
          oc -n "$NAMESPACE" get secret soba-test-mongodb-auth -o json |
            jq -e '.data["mongodb-passwords"] != null' >/dev/null

      - name: Recover pending Helm release
        # Checkouts that predate the action skip recovery.
        if: hashFiles('.github/actions/recover-helm-release/action.yaml') != ''
        uses: ./.github/actions/recover-helm-release
        with:
          release: soba-test-mongodb
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Deploy MongoDB
        env:
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
        run: |
          set -euo pipefail
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm dependency build deployments/helm/action-mongodb
          helm upgrade --install "soba-test-mongodb" deployments/helm/action-mongodb \
            --namespace "$NAMESPACE" \
            --wait \
            --timeout 660s \
            -f deployments/helm/action-mongodb/values-test.yaml

  deploy:
    name: Deploy SOBA to Test
    needs: [set-vars, version, build, deploy-crunchy, deploy-mongodb]
    permissions:
      contents: read
    environment:
      name: test
      url: https://${{ env.ACRONYM }}-test.${{ vars.OC_DOMAIN }}/designer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: ${{ env.OC_VERSION }}

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Get DB config from Crunchy secret
        id: db
        env:
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
          CLUSTER: ${{ needs.deploy-crunchy.outputs.cluster }}
        run: |
          SECRET_NAME="${CLUSTER}-pguser-app"
          echo "secret_name=$SECRET_NAME" >> "$GITHUB_OUTPUT"
          echo "runtime_secret_name=${CLUSTER}-pguser-appproxy" >> "$GITHUB_OUTPUT"

      # Pipeline performance fix: Revert if needed.
      - name: Wait for test database readiness
        uses: ./.github/actions/wait-for-postgres
        with:
          secret_name: ${{ steps.db.outputs.secret_name }}
          namespace: ${{ vars.OC_NAMESPACE }}
          label: test database
      # Pipeline performance fix: Revert if needed.

      - name: Recover pending Helm release
        # Checkouts that predate the action skip recovery.
        if: hashFiles('.github/actions/recover-helm-release/action.yaml') != ''
        uses: ./.github/actions/recover-helm-release
        with:
          release: soba-test
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Generate values override and deploy
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
          TAG: ${{ needs.version.outputs.image_version }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          DOMAIN: ${{ vars.OC_DOMAIN }}
          VAULT_AUTH_PATH: ${{ vars.VAULT_AUTH_PATH }}
          VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}
          VAULT_ROLE: ${{ vars.VAULT_ROLE_NONPROD }}
          VAULT_SECRET_PATH: ${{ vars.VAULT_SECRET_PATH }}
          VAULT_SERVICE_ACCOUNT_NAME: ${{ vars.VAULT_SERVICE_ACCOUNT_NAME }}
        run: |
          set -euo pipefail
          : "${VAULT_AUTH_PATH:?Set the VAULT_AUTH_PATH variable.}"
          : "${VAULT_NAMESPACE:?Set the VAULT_NAMESPACE variable.}"
          : "${VAULT_ROLE:?Set the VAULT_ROLE_NONPROD variable.}"
          : "${VAULT_SECRET_PATH:?Set VAULT_SECRET_PATH on the test environment.}"
          : "${VAULT_SERVICE_ACCOUNT_NAME:?Set the VAULT_SERVICE_ACCOUNT_NAME variable.}"
          REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          # Version /meta reports, e.g. 2.0.0-beta.0+test.a1b2c3d. Empty if unreadable: the
          # chart then omits APP_VERSION and the backend falls back to package.json.
          BASE_VERSION=$(jq -r '.version // empty' backend/package.json 2>/dev/null || echo "")
          APP_VERSION=""
          if [[ "$BASE_VERSION" =~ ^[0-9A-Za-z.-]+$ ]]; then
            APP_VERSION="${BASE_VERSION}+test.${SHORT_SHA}"
          fi

          cat > /tmp/values-override.yaml <<OVERRIDE
          backend:
            image:
              repository: "ghcr.io/${REPO_LC}/backend"
              tag: "${TAG}"
            config:
              appVersion: "${APP_VERSION}"
              gitSha: "${SHORT_SHA}"
              gitTag: "${TAG}"
              imageTag: "${TAG}"
          frontend:
            image:
              repository: "ghcr.io/${REPO_LC}/frontend"
              tag: "${TAG}"
          global:
            domain: "${DOMAIN}"
          database:
            existingSecretName: "${{ steps.db.outputs.secret_name }}"
            existingSecretKey: "uri"
            runtimeSecretName: "${{ steps.db.outputs.runtime_secret_name }}"
            runtimeSecretKey: "pgbouncer-uri"
            runtimeRole: "appproxy"
          mongodb:
            internal:
              enabled: false
            external:
              # All members, so Form.io can connect while any is down. The chart appends :port.
              host: "soba-test-mongodb-0.soba-test-mongodb-headless:27017,soba-test-mongodb-1.soba-test-mongodb-headless:27017,soba-test-mongodb-2.soba-test-mongodb-headless"
              authSecretName: soba-test-mongodb-auth
          OVERRIDE

          # Pipeline performance fix: Revert if needed.
          helm upgrade --install "soba-test" ./deployments/helm/soba \
            --namespace "${NAMESPACE}" \
            --wait \
            --wait-for-jobs \
            --timeout 660s \
            -f deployments/helm/soba/values-test.yaml \
            -f /tmp/values-override.yaml \
            --set-string "vault.authPath=${VAULT_AUTH_PATH}" \
            --set-string "vault.namespace=${VAULT_NAMESPACE}" \
            --set-string "vault.role=${VAULT_ROLE}" \
            --set-string "vault.secretPath=${VAULT_SECRET_PATH}" \
            --set-string "vault.serviceAccountName=${VAULT_SERVICE_ACCOUNT_NAME}"
          # Pipeline performance fix: Revert if needed.

      # Pipeline performance fix: Revert if needed.
      # Temporarily disabled openshift diagnostics; uncomment to restore.
      # - name: Deployment diagnostics
      #   if: failure()
      #   uses: ./.github/actions/openshift-diagnostics
      #   with:
      #     release: soba-test
      #     namespace: ${{ vars.OC_NAMESPACE }}
      #     database_secret_name: ${{ steps.db.outputs.secret_name }}
      # Pipeline performance fix: Revert if needed.

  gateway:
    name: Verify Test through APS gateway
    needs: [deploy]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gateway-proxy-check.yaml
    with:
      environment: test
      release: soba-test
    secrets: inherit

  Tests:
    name: Integration Tests
    needs: [deploy, set-vars]
    uses: ./.github/workflows/playwright.yaml
    with:
      DEP_ENV: test
      pr_branch: ${{ needs.set-vars.outputs.ref }}
    secrets:
      keycloakUsername: ${{ secrets.keycloakUsername }}
      keycloakPassword: ${{ secrets.keycloakPassword }}
      MFA_CODE: ${{ secrets.MFA_CODE }}

  tested-image:
    name: Record validated release image
    needs: [set-vars, version, build, gateway, Tests]
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Record successful TEST validation on the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.version.outputs.ref }}
          IMAGE_TAG: ${{ needs.version.outputs.image_version }}
          BRANCH: ${{ needs.set-vars.outputs.branch }}
        run: |
          set -euo pipefail
          IMAGE_ROOT="ghcr.io/${GITHUB_REPOSITORY,,}"
          for entry in 'backend|' 'frontend|-designer' 'frontend|-forms' 'temporal-worker|'; do
            IFS='|' read -r image suffix <<< "$entry"
            digest=$(docker buildx imagetools inspect \
              "$IMAGE_ROOT/$image:$IMAGE_TAG$suffix" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
              -f state=success \
              -f "context=soba/release-digest/$image$suffix" \
              -f "description=$digest" >/dev/null
          done
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=success \
            -f context=soba/release-test \
            -f description="TEST validated $BRANCH image $IMAGE_TAG" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
