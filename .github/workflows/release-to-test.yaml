# Deploy release branches to the OpenShift test environment.
name: Release to Test
run-name: Deploy ${{ github.event.inputs.release_branch || github.ref_name }} to Test

env:
  ACRONYM: soba
  OC_VERSION: "4.14"

on:
  push:
    branches:
      - "release/sprint-*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "lib/**"
      - ".github/workflows/release-to-test.yaml"
      - ".github/workflows/build-images.yaml"
      - ".github/workflows/playwright.yaml"
      - "integration/playwright/**"
      - ".gitignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deployments/**"
  create:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch to deploy, for example release/sprint-30"
        required: true
        type: string

permissions: {}

concurrency:
  group: openshift-test
  cancel-in-progress: false

jobs:
  set-vars:
    name: Set release variables
    # The create event is emitted for every new branch and tag; only release
    # branches should start this deployment workflow.
    if: ${{ github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/sprint-')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.vars.outputs.ref }}
      branch: ${{ steps.vars.outputs.branch }}
      image_version: ${{ steps.vars.outputs.image_version }}
    steps:
      - name: Validate release branch
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.event.inputs.release_branch }}"
          elif [ "${{ github.event_name }}" = "create" ]; then
            BRANCH="${{ github.event.ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          if ! echo "$BRANCH" | grep -Eq '^release/sprint-[0-9]+$'; then
            echo "Branch '$BRANCH' does not match release/sprint-xxx."
            exit 1
          fi

          # Keep release images distinct from ordinary branch images.
          # release/sprint-34 becomes soba-release-sprint-34.
          IMAGE_VERSION="soba-$(echo "$BRANCH" | tr '/' '-')"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "ref=refs/heads/$BRANCH" >> "$GITHUB_OUTPUT"
          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push
    uses: ./.github/workflows/build-images.yaml
    needs: [set-vars]
    with:
      ref: ${{ needs.set-vars.outputs.ref }}
      platforms: amd64
      image_version: ${{ needs.set-vars.outputs.image_version }}
      publish_latest: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy-crunchy:
    name: Deploy Crunchy Postgres
    needs: [set-vars]
    environment:
      name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      cluster: ${{ steps.crunchy.outputs.cluster }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Deploy Crunchy
        id: crunchy
        uses: bcgov/actions-openshift/crunchy@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          oc_server: ${{ vars.OC_SERVER }}
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_token: ${{ secrets.OC_TOKEN }}
          values_file: deployments/helm/action-crunchy/values-test.yaml
          release_name: pg-soba-test

  deploy-mongodb:
    name: Deploy MongoDB
    needs: [set-vars]
    permissions:
      contents: read
    environment:
      name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: ${{ env.OC_VERSION }}

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Validate MongoDB auth secret
        env:
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
        run: |
          set -euo pipefail
          oc -n "$NAMESPACE" get secret soba-test-mongodb-auth -o json |
            jq -e '.data["mongodb-passwords"] != null' >/dev/null

      - name: Recover pending Helm release
        # Checkouts that predate the action skip recovery.
        if: hashFiles('.github/actions/recover-helm-release/action.yaml') != ''
        uses: ./.github/actions/recover-helm-release
        with:
          release: soba-test-mongodb
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Deploy MongoDB
        env:
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
        run: |
          set -euo pipefail
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm dependency build deployments/helm/action-mongodb
          helm upgrade --install "soba-test-mongodb" deployments/helm/action-mongodb \
            --namespace "$NAMESPACE" \
            --wait \
            --timeout 660s \
            -f deployments/helm/action-mongodb/values-test.yaml

  deploy:
    name: Deploy SOBA to Test
    needs: [set-vars, build, deploy-crunchy, deploy-mongodb]
    permissions:
      contents: read
    environment:
      name: test
      url: https://${{ env.ACRONYM }}-test.${{ vars.OC_DOMAIN }}/designer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.set-vars.outputs.ref }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: ${{ env.OC_VERSION }}

      - name: Login to OpenShift Cluster
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Get DB config from Crunchy secret
        id: db
        env:
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
          CLUSTER: ${{ needs.deploy-crunchy.outputs.cluster }}
        run: |
          SECRET_NAME="${CLUSTER}-pguser-app"
          echo "secret_name=$SECRET_NAME" >> "$GITHUB_OUTPUT"

      # Pipeline performance fix: Revert if needed.
      - name: Wait for test database readiness
        uses: ./.github/actions/wait-for-postgres
        with:
          secret_name: ${{ steps.db.outputs.secret_name }}
          secret_key: pgbouncer-uri
          namespace: ${{ vars.OC_NAMESPACE }}
          label: test database
      # Pipeline performance fix: Revert if needed.

      - name: Recover pending Helm release
        # Checkouts that predate the action skip recovery.
        if: hashFiles('.github/actions/recover-helm-release/action.yaml') != ''
        uses: ./.github/actions/recover-helm-release
        with:
          release: soba-test
          namespace: ${{ vars.OC_NAMESPACE }}

      - name: Generate values override and deploy
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NAMESPACE: ${{ vars.OC_NAMESPACE }}
          TAG: sha-${{ needs.build.outputs.short_sha }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          DOMAIN: ${{ vars.OC_DOMAIN }}
          VAULT_AUTH_PATH: ${{ vars.VAULT_AUTH_PATH }}
          VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}
          VAULT_ROLE: ${{ vars.VAULT_ROLE_NONPROD }}
          VAULT_SECRET_PATH: ${{ vars.VAULT_SECRET_PATH }}
          VAULT_SERVICE_ACCOUNT_NAME: ${{ vars.VAULT_SERVICE_ACCOUNT_NAME }}
        run: |
          set -euo pipefail
          : "${VAULT_AUTH_PATH:?Set the VAULT_AUTH_PATH variable.}"
          : "${VAULT_NAMESPACE:?Set the VAULT_NAMESPACE variable.}"
          : "${VAULT_ROLE:?Set the VAULT_ROLE_NONPROD variable.}"
          : "${VAULT_SECRET_PATH:?Set VAULT_SECRET_PATH on the test environment.}"
          : "${VAULT_SERVICE_ACCOUNT_NAME:?Set the VAULT_SERVICE_ACCOUNT_NAME variable.}"
          REPO_LC=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          # Version /meta reports, e.g. 2.0.0-beta.0+test.a1b2c3d. Empty if unreadable: the
          # chart then omits APP_VERSION and the backend falls back to package.json.
          BASE_VERSION=$(jq -r '.version // empty' backend/package.json 2>/dev/null || echo "")
          APP_VERSION=""
          if [[ "$BASE_VERSION" =~ ^[0-9A-Za-z.-]+$ ]]; then
            APP_VERSION="${BASE_VERSION}+test.${SHORT_SHA}"
          fi

          cat > /tmp/values-override.yaml <<OVERRIDE
          backend:
            image:
              repository: "ghcr.io/${REPO_LC}/backend"
              tag: "${TAG}"
            config:
              appVersion: "${APP_VERSION}"
              gitSha: "${SHORT_SHA}"
              gitTag: "${TAG}"
              imageTag: "${TAG}"
          frontend:
            image:
              repository: "ghcr.io/${REPO_LC}/frontend"
              tag: "${TAG}"
          global:
            domain: "${DOMAIN}"
          database:
            existingSecretName: "${{ steps.db.outputs.secret_name }}"
            existingSecretKey: "pgbouncer-uri"
          mongodb:
            internal:
              enabled: false
            external:
              host: "soba-test-mongodb-0.soba-test-mongodb-headless"
              authSecretName: soba-test-mongodb-auth
          OVERRIDE

          # Pipeline performance fix: Revert if needed.
          helm upgrade --install "soba-test" ./deployments/helm/soba \
            --namespace "${NAMESPACE}" \
            --wait \
            --wait-for-jobs \
            --timeout 660s \
            -f deployments/helm/soba/values-test.yaml \
            -f /tmp/values-override.yaml \
            --set-string "vault.authPath=${VAULT_AUTH_PATH}" \
            --set-string "vault.namespace=${VAULT_NAMESPACE}" \
            --set-string "vault.role=${VAULT_ROLE}" \
            --set-string "vault.secretPath=${VAULT_SECRET_PATH}" \
            --set-string "vault.serviceAccountName=${VAULT_SERVICE_ACCOUNT_NAME}"
          # Pipeline performance fix: Revert if needed.

      # Pipeline performance fix: Revert if needed.
      # Temporarily disabled openshift diagnostics; uncomment to restore.
      # - name: Deployment diagnostics
      #   if: failure()
      #   uses: ./.github/actions/openshift-diagnostics
      #   with:
      #     release: soba-test
      #     namespace: ${{ vars.OC_NAMESPACE }}
      #     database_secret_name: ${{ steps.db.outputs.secret_name }}
      # Pipeline performance fix: Revert if needed.

  gateway:
    name: Verify Test through APS gateway
    needs: [deploy]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gateway-proxy-check.yaml
    with:
      environment: test
      release: soba-test
    secrets: inherit

  Tests:
    name: Integration Tests
    needs: [deploy, set-vars]
    uses: ./.github/workflows/playwright.yaml
    with:
      DEP_ENV: test
      pr_branch: ${{ needs.set-vars.outputs.ref }}
    secrets:
      keycloakUsername: ${{ secrets.keycloakUsername }}
      keycloakPassword: ${{ secrets.keycloakPassword }}
      MFA_CODE: ${{ secrets.MFA_CODE }}
