name: Playwright Tests
on:
  workflow_call:
    inputs:
      DEP_ENV:
        required: true
        type: string
      pr_branch:
        required: true
        type: string
      BASE_URL:
        required: false
        type: string
    secrets:
      keycloakUsername:
        required: true
      keycloakPassword:
        required: true
      MFA_CODE:
        required: true
  workflow_dispatch:
    inputs:
      DEP_ENV:
        description: dev, test, or a PR number
        required: true
        default: dev
        type: string
      pr_branch:
        description: Ref to take the tests from
        required: true
        default: develop
        type: string

permissions: {}

jobs:
  playwright-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_branch }}
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci
        working-directory: ./integration/playwright

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./integration/playwright

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: ./integration/playwright
        env:
          KEYCLOAK_USERNAME: ${{ secrets.keycloakUsername }}
          KEYCLOAK_PASSWORD: ${{ secrets.keycloakPassword }}
          MFA_CODE: ${{ secrets.MFA_CODE }}
          DEP_ENV: ${{ inputs.DEP_ENV }}
          BASE_URL: ${{ inputs.BASE_URL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: "${{ github.workspace }}/integration/playwright/playwright-report"
          if-no-files-found: ignore

      - name: Upload Playwright screenshots on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-screenshots
          path: "${{ github.workspace }}/integration/playwright/test-results"
