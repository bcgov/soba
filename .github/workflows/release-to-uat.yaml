name: Promote Release to UAT
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Recover UAT from main' || format('Promote {0} to UAT', github.event.pull_request.head.ref) }}

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

# Jobs opt in to the minimum permissions needed for their work.
permissions: {}

# Do not let concurrent promotions mutate the UAT tags or Helm release together.
concurrency:
  group: openshift-uat
  cancel-in-progress: false

env:
  ACRONYM: soba
  OC_VERSION: "4.14"
  REGISTRY: ghcr.io

jobs:
  set-vars:
    name: Validate release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/s') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    outputs:
      branch: ${{ steps.release.outputs.branch }}
      chart_ref: ${{ steps.release.outputs.chart_ref }}
      release_tag: ${{ steps.tags.outputs.release_tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      short_sha: ${{ steps.tags.outputs.short_sha }}
      uat_tag: ${{ steps.tags.outputs.uat_tag }}
      app_version: ${{ steps.tags.outputs.app_version }}
    steps:
      - name: Select tested release image
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$EVENT_REF" != "refs/heads/main" ]; then
              echo "::error::UAT recovery can only run from main."
              exit 1
            fi

            # The selected main commit must be the merge of exactly one release PR.
            # This recovers its existing Test image tag without accepting a branch input.
            PRS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$EVENT_SHA/pulls?per_page=100")
            MATCHES=$(jq --arg repo "$GITHUB_REPOSITORY" --arg sha "$EVENT_SHA" \
              '[.[] | select(.merged_at != null and .base.ref == "main" and .head.repo.full_name == $repo and .merge_commit_sha == $sha and (.head.ref | test("^release/s[0-9]+-r[0-9]+$")))]' \
              <<< "$PRS")
            if [ "$(jq 'length' <<< "$MATCHES")" -ne 1 ]; then
              echo "::error::The current main commit must belong to exactly one merged release/s<number>-r<number> PR. No UAT image was promoted."
              exit 1
            fi
            BRANCH=$(jq -r '.[0].head.ref' <<< "$MATCHES")
            SOURCE_SHA=$(jq -r '.[0].head.sha' <<< "$MATCHES")
            CHART_REF="$EVENT_SHA"
          else
            BRANCH="$RELEASE_BRANCH"
            SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
            CHART_REF="$MERGE_SHA"
          fi

          if ! [[ "$BRANCH" =~ ^release/s[0-9]+-r[0-9]+$ ]]; then
            echo "The release branch must match release/s<number>-r<number>." >&2
            exit 1
          fi

          printf 'branch=%s\n' "$BRANCH" >> "$GITHUB_OUTPUT"
          printf 'chart_ref=%s\n' "$CHART_REF" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout release source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          fetch-depth: 0

      - name: Derive image tags from release source commit
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="${{ steps.release.outputs.branch }}"
          VERSION=$(jq -r .version backend/package.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [ "$VERSION" != "$(jq -r .version package.json)" ]; then
            echo '::error::Release source has no synchronized stable application version.'
            exit 1
          fi
          printf 'short_sha=%s\n' "$SHORT_SHA" >> "$GITHUB_OUTPUT"
          printf 'app_version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'release_tag=release-v%s-%s\n' "$VERSION" "${BRANCH#release/}" >> "$GITHUB_OUTPUT"
          printf 'uat_tag=uat-v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag version accepted into main
        env:
          CHART_REF: ${{ steps.release.outputs.chart_ref }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.tags.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor "$SOURCE_SHA" "$CHART_REF" || {
            echo '::error::The release PR must preserve its tested source commit in main for future Conventional Commit ranges.'
            exit 1
          }
          [ "$(git show "$CHART_REF":package.json | jq -r .version)" = "$VERSION" ] || {
            echo '::error::main and release source versions differ.'
            exit 1
          }
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            [ "$(git rev-list -n 1 "$TAG")" = "$CHART_REF" ] || {
              echo "::error::Official tag $TAG already points to a different release."
              exit 1
            }
          else
            git tag "$TAG" "$CHART_REF"
            git push origin "refs/tags/$TAG"
          fi

  approve-uat:
    name: Approve UAT promotion
    needs: [set-vars]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    # Configure required reviewers on this separate environment before merging.
    # The Crunchy workflow uses the uat environment and must remain runnable while this waits.
    environment:
      name: uat-promotion-approval
    steps:
      - name: Record approval
        shell: bash
        run: |
          echo 'UAT promotion approved.'

  promote-images:
    name: Retag release images for UAT
    needs: [set-vars, approve-uat]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    environment:
      name: uat
    env:
      CHART_REF: ${{ needs.set-vars.outputs.chart_ref }}
      SOURCE_SHA: ${{ needs.set-vars.outputs.source_sha }}
      SHORT_SHA: ${{ needs.set-vars.outputs.short_sha }}
      RELEASE_TAG: ${{ needs.set-vars.outputs.release_tag }}
      UAT_TAG: ${{ needs.set-vars.outputs.uat_tag }}
      APP_VERSION: ${{ needs.set-vars.outputs.app_version }}
      BRANCH: ${{ needs.set-vars.outputs.branch }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout accepted main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CHART_REF }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Copy release manifests to UAT tags
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$MAIN_SHA" != "$CHART_REF" ]; then
            echo "::error::main has moved since this release merged. No UAT image was promoted."
            exit 1
          fi
          if [ "$(jq -r .version package.json)" != "$APP_VERSION" ]; then
            echo '::error::main and the tested release source have different application versions.'
            exit 1
          fi
          TEST_RUNS=$(gh api "repos/$REPOSITORY/actions/workflows/release-to-test.yaml/runs?head_sha=$SOURCE_SHA&branch=$BRANCH&status=success&per_page=100" --jq '.total_count')
          if [ "$TEST_RUNS" -lt 1 ]; then
            echo "::error::No successful Test workflow run exists for $SOURCE_SHA."
            exit 1
          fi
          REPOSITORY_LOWER="${REPOSITORY,,}"
          IMAGE_ROOT="$REGISTRY/$REPOSITORY_LOWER"
          digest() {
            local image_ref="$1"
            docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          }
          for entry in 'backend|' 'frontend|-designer' 'frontend|-forms' 'temporal-worker|'; do
            IFS='|' read -r image suffix <<< "$entry"
            sha_ref="$IMAGE_ROOT/$image:sha-$SHORT_SHA$suffix"
            release_ref="$IMAGE_ROOT/$image:$RELEASE_TAG$suffix"
            target="$IMAGE_ROOT/$image:$UAT_TAG$suffix"
            source_digest=$(digest "$sha_ref")
            [ "$(digest "$release_ref")" = "$source_digest" ] || {
              echo "::error::Release and SHA tags differ: $release_ref"
              exit 1
            }
            if target_digest=$(digest "$target" 2>"$RUNNER_TEMP/target-error"); then
              [ "$target_digest" = "$source_digest" ] || {
                echo "::error::Refusing to overwrite a different digest: $target"
                exit 1
              }
            elif ! grep -Eqi 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/target-error"; then
              cat "$RUNNER_TEMP/target-error" >&2
              exit 1
            fi
            printf '%s|%s\n' "$target" "$source_digest" >> "$RUNNER_TEMP/uat-images"
          done
          while IFS='|' read -r target source_digest; do
            docker buildx imagetools create -t "$target" "${target%:*}@$source_digest"
            [ "$(digest "$target")" = "$source_digest" ] || exit 1
          done < "$RUNNER_TEMP/uat-images"


  deploy:
    name: Deploy promoted images to UAT
    needs: [set-vars, promote-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: uat
      url: https://${{ env.ACRONYM }}-uat.${{ vars.OC_DOMAIN }}/designer
    env:
      NAMESPACE: ${{ vars.OC_NAMESPACE }}
      OC_SERVER: ${{ vars.OC_SERVER }}
      OC_TOKEN: ${{ secrets.OC_TOKEN }}
      OC_DOMAIN: ${{ vars.OC_DOMAIN }}
      CRUNCHY_CLUSTER: pg-soba-uat-crunchy
      MONGODB_HOST: ${{ vars.MONGODB_HOST }}
      MONGODB_PORT: ${{ vars.MONGODB_PORT || '27017' }}
      MONGODB_USERNAME: ${{ vars.MONGODB_USERNAME || 'formio' }}
      MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE || 'formio-ce' }}
      MONGODB_AUTH_SOURCE: ${{ vars.MONGODB_AUTH_SOURCE || 'formio-ce' }}
      MONGODB_REPLICA_SET: ${{ vars.MONGODB_REPLICA_SET || 'rs0' }}
      VAULT_AUTH_PATH: ${{ vars.VAULT_AUTH_PATH }}
      VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}
      VAULT_ROLE: ${{ vars.VAULT_ROLE_NONPROD }}
      VAULT_SECRET_PATH: ${{ vars.VAULT_SECRET_PATH }}
      VAULT_SERVICE_ACCOUNT_NAME: ${{ vars.VAULT_SERVICE_ACCOUNT_NAME }}
      CHART_REF: ${{ needs.set-vars.outputs.chart_ref }}
      RELEASE_TAG: ${{ needs.set-vars.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.set-vars.outputs.source_sha }}
      UAT_TAG: ${{ needs.set-vars.outputs.uat_tag }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout deployment chart
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CHART_REF }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@e3b32c2ab7b064b2ce189121c4a49f509a99a7b4 # v3.0
        with:
          oc: ${{ env.OC_VERSION }}

      - name: Authenticate to OpenShift
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ env.OC_SERVER }}
          openshift_token: ${{ env.OC_TOKEN }}
          namespace: ${{ env.NAMESPACE }}

      - name: Validate UAT configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${NAMESPACE:?Set the OC_NAMESPACE UAT environment variable.}"
          : "${OC_SERVER:?Set the OC_SERVER UAT environment variable.}"
          : "${OC_DOMAIN:?Set the OC_DOMAIN UAT environment variable.}"
          : "${MONGODB_HOST:?Set the MONGODB_HOST UAT environment variable.}"
          : "${VAULT_AUTH_PATH:?Set the VAULT_AUTH_PATH repository variable.}"
          : "${VAULT_NAMESPACE:?Set the VAULT_NAMESPACE repository variable.}"
          : "${VAULT_ROLE:?Set the VAULT_ROLE_NONPROD repository variable.}"
          : "${VAULT_SECRET_PATH:?Set the VAULT_SECRET_PATH UAT environment variable.}"
          : "${VAULT_SERVICE_ACCOUNT_NAME:?Set the VAULT_SERVICE_ACCOUNT_NAME repository variable.}"
          MONGODB_AUTH_SECRET_NAME=$(ruby -ryaml -e 'puts YAML.load_file(ARGV.fetch(0)).dig("mongodb", "external", "authSecretName")' deployments/helm/soba/values-uat.yaml)
          : "${MONGODB_AUTH_SECRET_NAME:?Set mongodb.external.authSecretName in values-uat.yaml.}"

          oc -n "$NAMESPACE" get secret "${CRUNCHY_CLUSTER}-pguser-app" -o json |
            jq -e '.data.uri != null' >/dev/null
          oc -n "$NAMESPACE" get secret "${CRUNCHY_CLUSTER}-pguser-appproxy" -o json |
            jq -e '.data["pgbouncer-uri"] != null' >/dev/null
          oc -n "$NAMESPACE" get secret "$MONGODB_AUTH_SECRET_NAME" -o json |
            jq -e '.data["mongodb-passwords"] != null' >/dev/null

      - name: Recover pending Helm release
        # Checkouts that predate the action skip recovery.
        if: hashFiles('.github/actions/recover-helm-release/action.yaml') != ''
        uses: ./.github/actions/recover-helm-release
        with:
          release: ${{ env.ACRONYM }}-uat
          namespace: ${{ env.NAMESPACE }}

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          REPOSITORY_LOWER="${REPOSITORY,,}"
          helm upgrade --install "$ACRONYM-uat" ./deployments/helm/soba \
            --namespace "$NAMESPACE" \
            --wait \
            --wait-for-jobs \
            --timeout 900s \
            -f deployments/helm/soba/values-uat.yaml \
            --set-string "backend.image.repository=ghcr.io/$REPOSITORY_LOWER/backend" \
            --set-string "backend.image.tag=$UAT_TAG" \
            --set-string "backend.config.appVersion=${{ needs.set-vars.outputs.app_version }}" \
            --set-string "backend.config.gitSha=$SOURCE_SHA" \
            --set-string "backend.config.gitTag=$UAT_TAG" \
            --set-string "backend.config.imageTag=$UAT_TAG" \
            --set-string "frontend.image.repository=ghcr.io/$REPOSITORY_LOWER/frontend" \
            --set-string "frontend.image.tag=$UAT_TAG" \
            --set-string "temporalWorkersImage.repository=ghcr.io/$REPOSITORY_LOWER/temporal-worker" \
            --set-string "temporalWorkersImage.tag=$UAT_TAG" \
            --set-string "temporalWorkersImage.pullPolicy=IfNotPresent" \
            --set-string "global.domain=$OC_DOMAIN" \
            --set-string "database.existingSecretName=${CRUNCHY_CLUSTER}-pguser-app" \
            --set-string "database.existingSecretKey=uri" \
            --set-string "database.runtimeSecretName=${CRUNCHY_CLUSTER}-pguser-appproxy" \
            --set-string "database.runtimeSecretKey=pgbouncer-uri" \
            --set-string "database.runtimeRole=appproxy" \
            --set-string "mongodb.external.host=$MONGODB_HOST" \
            --set-string "mongodb.external.port=$MONGODB_PORT" \
            --set-string "mongodb.external.username=$MONGODB_USERNAME" \
            --set-string "mongodb.external.database=$MONGODB_DATABASE" \
            --set-string "mongodb.external.authSource=$MONGODB_AUTH_SOURCE" \
            --set-string "mongodb.external.replicaSet=$MONGODB_REPLICA_SET" \
            --set-string "vault.authPath=$VAULT_AUTH_PATH" \
            --set-string "vault.namespace=$VAULT_NAMESPACE" \
            --set-string "vault.role=$VAULT_ROLE" \
            --set-string "vault.secretPath=$VAULT_SECRET_PATH" \
            --set-string "vault.serviceAccountName=$VAULT_SERVICE_ACCOUNT_NAME"

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## UAT deployment"
            echo
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Promoted UAT tag: \`${UAT_TAG}\`"
            echo "- Namespace: \`${NAMESPACE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  gateway:
    name: Verify UAT through APS gateway
    needs: [deploy]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gateway-proxy-check.yaml
    with:
      environment: uat
      release: soba-uat
    secrets: inherit
