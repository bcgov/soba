name: SonarQube Cloud analysis

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze code
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Link to SonarQube analysis
        shell: bash
        run: |
          dashboard_url=$(sed -n 's/^dashboardUrl=//p' .scannerwork/report-task.txt)
          if [[ -z "$dashboard_url" ]]; then
            echo 'SonarQube scan did not provide a results link.' >&2
            exit 1
          fi
          printf '### SonarQube analysis\n\n[View analysis results](%s)\n' "$dashboard_url" >> "$GITHUB_STEP_SUMMARY"
